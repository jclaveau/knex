---
name: batchUpdate Benchmark

# Informational only — compares the batchUpdate strategies (union / case / json)
# on every build and writes the table to the run summary. It never gates the
# build: CI runners are noisy, so the absolute timings are indicative, not a
# regression gate. Run locally for accurate numbers (see scripts/).
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  benchmark:
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'skip-tests') }}
    runs-on: ubuntu-latest
    name: batchUpdate Benchmark (sqlite)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          always-auth: false
          package-manager-cache: false
          node-version: 22.x

      - name: Run npm install
        run: |
          n=0
          until npm install; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "npm install failed after $n attempts"
              exit 1
            fi
            echo "npm install failed, retrying in 15s... (attempt $n)"
            sleep 15
          done

      - run: npm run build

      # sqlite is the one embedded dialect that runs all three strategies, so
      # it needs no service container. Tee to the step summary for visibility.
      - name: Run batchUpdate benchmark
        run: node scripts/batch-update-benchmark.js | tee -a "$GITHUB_STEP_SUMMARY"
