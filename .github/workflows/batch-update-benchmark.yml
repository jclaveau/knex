---
name: batchUpdate Benchmark

# Informational only — compares the batchUpdate strategies (union / case / json)
# across every dialect and writes the tables to the run summary. It never gates
# the build: CI runners are noisy, so the absolute timings are indicative, not a
# regression gate. Run locally for accurate numbers (see scripts/).
on:
  push:
    branches:
      - master
      - feat/batch-update
  pull_request:
    branches:
      - master
      - feat/batch-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'skip-tests') }}
    runs-on: ubuntu-latest
    name: batchUpdate Benchmark (${{ matrix.database-type }})

    strategy:
      fail-fast: false
      matrix:
        # One bench per dialect; node is pinned to 22.x (mariadb's client needs
        # 20+, and the bench doesn't vary by node). sqlite3 needs no server.
        database-type:
          [postgres, mysql, mariadb, mssql, cockroachdb, oracledb, sqlite3]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          always-auth: false
          package-manager-cache: false
          node-version: 22.x

      - name: Start Database
        run: |
          docker compose \
            --file "scripts/docker-compose.yml" \
            up \
              --detach \
              --build \
              "${{ matrix.database-type }}"
        if: matrix.database-type != 'sqlite3'

      - name: Run npm install
        run: |
          n=0
          until npm install; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "npm install failed after $n attempts"
              exit 1
            fi
            echo "npm install failed, retrying in 15s... (attempt $n)"
            sleep 15
          done

      - name: Initialize Database
        run: |
          docker compose \
            --file "scripts/docker-compose.yml" \
            up \
              "wait${{ matrix.database-type }}"
        if: matrix.database-type != 'sqlite3'

      - name: Install oracle dependencies
        run: ./scripts/oracledb-install-driver-libs.sh run
        if: matrix.database-type == 'oracledb'

      - run: npm run build

      # continue-on-error: this workflow is informational, so an unsupported
      # mode/dialect cell (printed inline as ERR) or a flaky service never reds
      # the build. The script tees its tables to the run summary.
      - name: Run batchUpdate benchmark (${{ matrix.database-type }})
        continue-on-error: true
        run: node scripts/batch-update-benchmark.js | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          DB: ${{ matrix.database-type }}
          KNEX_TEST_TIMEOUT: 60000

      - name: Stop Database
        run: |
          docker compose \
            --file "scripts/docker-compose.yml" \
            down
        if: matrix.database-type != 'sqlite3'
